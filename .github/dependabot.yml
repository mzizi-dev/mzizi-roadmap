# Dependabot version updates. Pull requests target the default branch; every
# merge to `main` is a release (release.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before Dependabot proposes it, so a hijacked
    # or broken release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
